services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-4000}:8000"   # WEB_PORT=4001 si el 4000 está ocupado
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:8.8
    command: redis-server --appendonly yes
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
