spring.application.name=tareas

# La conexión a la base de datos llega por variables de entorno (SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD) desde docker-compose.yml.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# /actuator/health/liveness y /actuator/health/readiness, usados por el HEALTHCHECK
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
