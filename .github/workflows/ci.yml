name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Las pruebas corren aquí; por eso el Dockerfile del proyecto usa -DskipTests
  pruebas:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: proyecto
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B -ntp verify

  # La imagen solo se construye si las pruebas pasan
  imagenes:
    needs: pruebas
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Revisar los Dockerfiles
        run: |
          docker build --check friendlyhello
          docker build --check proyecto

      - name: Construir las imágenes
        run: |
          docker build -t friendlyhello:ci friendlyhello
          docker build -t proyecto:ci proyecto

      - name: Escanear la imagen del proyecto con Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0 image --severity HIGH,CRITICAL --exit-code 0 proyecto:ci

      - name: Publicar en GHCR (solo en main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for img in friendlyhello proyecto; do
            docker tag $img:ci ghcr.io/$OWNER/$img:${{ github.sha }}
            docker tag $img:ci ghcr.io/$OWNER/$img:latest
            docker push ghcr.io/$OWNER/$img:${{ github.sha }}
            docker push ghcr.io/$OWNER/$img:latest
          done
